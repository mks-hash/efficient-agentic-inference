[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "efficient-agentic-inference"
version = "0.0.1"
description = "Reproducible research on specialization economics inside agent systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
eai = "efficient_agentic_inference.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/efficient_agentic_inference"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
