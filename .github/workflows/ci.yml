name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra data
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m unittest discover -s tests -v
      - run: >-
          uv run eai-context --synthetic
          --inputs examples/localization-v2/tasks.jsonl
          --output results/runs/ci-context
      - run: >-
          uv run eai-predict --synthetic
          --inputs examples/localization-v2/tasks.jsonl
          --output results/runs/ci-fixture
      - run: >-
          uv run eai-evaluate
          --predictions results/runs/ci-fixture
          --gold examples/localization-v2/gold.jsonl
          --output results/runs/ci-evaluation
      - run: >-
          uv run python -m efficient_agentic_inference.accounting
          --ledger examples/accounting-v1/ledger.json
          --evaluation examples/accounting-v1/evaluation.json
          --output results/runs/ci-cost-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-fixture-${{ matrix.python }}
          path: results/runs/ci-*/
