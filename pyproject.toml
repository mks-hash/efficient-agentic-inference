[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "efficient-agentic-inference"
version = "0.3.0"
description = "Reproducible research on specialization economics inside agent systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
eai = "efficient_agentic_inference.cli:main"
eai-predict = "efficient_agentic_inference.predict:main"
eai-evaluate = "efficient_agentic_inference.evaluation:main"
eai-snapshot = "efficient_agentic_inference.snapshot:main"
eai-context = "efficient_agentic_inference.context:main"
eai-llama-predict = "efficient_agentic_inference.llama_predict:main"

[project.optional-dependencies]
data = ["pyarrow>=19,<24"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/efficient_agentic_inference"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
